apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: owllabs-app
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: app=owllabsdocker/test1-owl
    argocd-image-updater.argoproj.io/app.update-strategy: newest-build
spec:
  project: default
  source:
    repoURL: https://github.com/owllabsgit/test1-owl.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

