apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: owllabs-app
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: test1-owl=docker.io/owllabsdocker/test1-owl
    argocd-image-updater.argoproj.io/app.allow-tags: regexp:^([a-f0-9]{7,40}|latest|test-check)$
    argocd-image-updater.argoproj.io/app.update-strategy: name
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
spec:
  project: default
  source:
    repoURL: https://github.com/owllabsgit/test1-owl.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
