apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test1-owl-dev
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: app=docker.io/owllabsdocker/test1-owl
    argocd-image-updater.argoproj.io/app.update-strategy: newest-build
    argocd-image-updater.argoproj.io/app.allow-tags: regexp:^([0-9a-f]{7,})$
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main  
spec:
  project: default
  source:
    repoURL: https://github.com/owllabsgit/test1-owl.git
    targetRevision: main
    path: k8s/         # ← points to dev kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
