apiVersion: argoproj.io/v1alpha1
kind: Application
meta
  name: my-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/owllabsgit/test1-owl.git
    targetRevision: main
    path: k8s
    kustomize:
      # 🔥 This changes on every sync → forces rollout
      commonAnnotations:
        redeploy-timestamp: '{{time "2006-01-02T15:04:05Z07:00"}}'
  destination:
    server: https://kubernetes.default.svc
    namespace: test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
