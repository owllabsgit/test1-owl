apiVersion: argoproj.io/v1alpha1
kind: Application
meta
  name: owllabs-app
  namespace: argocd
  annotations:
    # ✅ Enable Argo CD Image Updater (only if installed!)
    argocd-image-updater.argoproj.io/image-list: app=docker.io/owllabsdocker/test1-owl
    # ✅ Match tags that look like Git SHAs (7-40 hex chars)
    argocd-image-updater.argoproj.io/app.allow-tags: regexp:^([a-f0-9]{7,40})$
    # ✅ Use "name" strategy: pick the tag that sorts last alphabetically (SHA works)
    argocd-image-updater.argoproj.io/app.update-strategy: name
    # ✅ Write back updated image to Git (requires write access)
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/your-git-creds
spec:
  project: default
  source:
    repoURL: https://github.com/owllabsgit/test1-owl.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
