# k8s/symfony-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: symfony-app
  namespace: test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: symfony-app
  template:
    metadata:
      labels:
        app: symfony-app
      annotations:
        # 🔥 Cette ligne force un redéploiement à chaque changement
        kubernetes.io/change-trigger: "redeploy-on-change-$(date +%s)"
    spec:
      containers:
        - name: symfony
          image: owllabsdocker/owllabs:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: symfony-env
          env:
            - name: DATABASE_URL
              value: mysql://root:root@mysql:3306/symfony
